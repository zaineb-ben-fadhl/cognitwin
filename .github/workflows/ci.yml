name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (engine, safety, UI language, server)
        run: npm test
      - name: Simulation validation
        run: npm run validate > /dev/null
      - name: Docs are generated from the registry
        run: npm run docs && git diff --exit-code docs/DIMENSIONS.md
      - name: Production build
        run: npm run build
