<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CogniTwin — a non-clinical, explainable cognitive growth agent with a historised Brain Twin." />
    <meta name="theme-color" content="#6250d6" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>CogniTwin</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem('cognitwin-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CogniTwin needs JavaScript to run its exercises.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
